  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body class="bg-[#0E1117] text-[#E0E0E0] antialiased selection:bg-[#00E5FF]/20 selection:text-[#00E5FF]">
    <div id="root"></div>
    <div id="vp-root"></div>

    <style>
      .vp-overlay{
        position:fixed; inset:0; background:rgba(6,10,18,.78);
        backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
        display:none; align-items:center; justify-content:center;
        z-index:2147483647; padding:20px;
        font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
        transition: all 0.3s ease;
      }
      .vp-overlay.active{ display:flex; animation:vpFade .25s ease; }
      @keyframes vpFade{ from{opacity:0} to{opacity:1} }

      .vp-modal{
        background:#111820; color:#E0E0E0;
        border:1px solid rgba(0,229,255,.18);
        border-radius:16px; max-width:850px; width:100%; /* سایز متعادل شد */
        padding:26px 26px 20px; position:relative;
        box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(0,229,255,.05);
        animation:vpRise .3s cubic-bezier(.2,.8,.2,1);
        transition: max-width 0.3s ease;
      }
      @keyframes vpRise{ from{transform:translateY(14px);opacity:0} to{transform:none;opacity:1} }

      .vp-close{
        position:absolute; top:10px; right:14px;
        background:none; border:none; color:#6b8299;
        font-size:26px; line-height:1; cursor:pointer; transition:color .15s;
        z-index:10;
      }
      .vp-close:hover{ color:#00E5FF; }

      .vp-modal h2{
        margin:0 0 6px; font-size:1.4rem; font-weight:700;
        font-family:"Chakra Petch",system-ui,sans-serif;
        color:#fff; letter-spacing:.2px;
      }
      .vp-modal p{ margin:0 0 18px; color:#8fa3b8; font-size:.95rem; }

      .vp-video-wrap:empty{ display:none; }
      .vp-video-wrap{
        position:relative; width:100%; aspect-ratio:16/9;
        margin-bottom:18px; border-radius:10px; overflow:hidden;
        background:#000; border:1px solid rgba(0,229,255,.15);
      }
      .vp-video-wrap video{
        position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000;
      }

      .vp-actions{ display:flex; gap:10px; flex-wrap:wrap; }
      .vp-btn-primary,.vp-btn-secondary{
        padding:10px 20px; border-radius:8px; font-size:.95rem;
        cursor:pointer; border:1px solid transparent; font-weight:600;
        font-family:inherit; transition:.15s;
      }
      .vp-btn-primary{
        background:#00E5FF; color:#06121a;
        box-shadow:0 0 18px rgba(0,229,255,.35);
      }
      .vp-btn-primary:hover{ background:#4defff; box-shadow:0 0 24px rgba(0,229,255,.5); }
      .vp-btn-secondary{
        background:transparent; color:#8fa3b8;
        border-color:rgba(0,229,255,.2);
      }
      .vp-btn-secondary:hover{ color:#fff; border-color:rgba(0,229,255,.5); }

      .vp-checkbox{
        display:flex; align-items:center; gap:8px;
        margin-top:16px; font-size:.87rem; color:#8fa3b8; cursor:pointer;
      }
      .vp-checkbox input{
        width:16px; height:16px; cursor:pointer; accent-color:#00E5FF;
      }
    </style>

    <script>
    (function(){
      // لینک دانلود مستقیم ویدیو
      const VIDEO_DIRECT_URL = "https://drive.google.com/uc?export=download&id=1WDQ1NpA86szMcdITKaI2kpVNiy7XhljG";
      const STORAGE_KEY = "banitwin_video_dismissed";

      function boot(){
        if (localStorage.getItem(STORAGE_KEY)) return;

        const root = document.getElementById("vp-root");
        if (!root) return;

        root.innerHTML = `
          <div class="vp-overlay" id="vpOverlay">
            <div class="vp-modal" id="vpModal">
              <button class="vp-close" id="vpClose" aria-label="Close">&times;</button>
              <div id="vpTextContent">
                <h2>Want to watch the tutorial video?</h2>
                <p>Learn how BaniTwin works in this short walkthrough.</p>
              </div>
              <div class="vp-video-wrap" id="vpVideoWrap"></div>
              <div class="vp-actions" id="vpActions">
                <button class="vp-btn-primary" id="vpPlay">▶ Watch Video</button>
                <button class="vp-btn-secondary" id="vpLater">Maybe later</button>
              </div>
              <label class="vp-checkbox">
                <input type="checkbox" id="vpDontShow">
                Don't show this again
              </label>
            </div>
          </div>
        `;

        const overlay = document.getElementById("vpOverlay");
        const modal = document.getElementById("vpModal");
        
        setTimeout(() => overlay.classList.add("active"), 1200);

        function close(){
          if (document.getElementById("vpDontShow").checked){
            localStorage.setItem(STORAGE_KEY, "1");
          }
          overlay.classList.remove("active");
        }

        document.getElementById("vpClose").onclick = close;
        document.getElementById("vpLater").onclick = close;
        overlay.onclick = (e) => { if (e.target === overlay) close(); };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && overlay.classList.contains("active")) close();
        });

        document.getElementById("vpPlay").onclick = () => {
          const wrap = document.getElementById("vpVideoWrap");
          
          const video = document.createElement("video");
          video.src = VIDEO_DIRECT_URL;
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          
          wrap.appendChild(video);
          
          document.getElementById("vpActions").style.display = "none";
          document.getElementById("vpTextContent").style.display = "none";
          document.getElementById("vpDontShow").parentElement.style.display = "none";
          
          // بزرگ‌تر شدن به سایز متعادل‌تر
          modal.style.maxWidth = "1000px"; 
          modal.style.padding = "16px";
        };
      }

      if (document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded", () => setTimeout(boot, 400));
      } else {
        setTimeout(boot, 400);
      }
    })();
    </script>
  </body>
</html>
